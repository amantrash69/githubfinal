services:
  - type: web
    name: telegram-ai-forwarder
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    disk:
      name: forwarder-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/forwarder.db
      - key: PYTHON_VERSION
        value: 3.12.0
